# API Documentation

## Overview
REST API for DALLI E-commerce Platform v1.0

## Base URL
- Production: `https://api.dalli.rs/v1`
- Staging: `https://api-staging.dalli.rs/v1`
- Development: `http://localhost:3000/api/v1`

## Authentication
All endpoints require authentication via JWT Bearer token or API Key.

### Bearer Token
```
Authorization: Bearer <access_token>
```

### API Key
```
X-API-Key: your-api-key
```

## Rate Limiting
- Authenticated requests: 1000 requests/minute
- Anonymous requests: 100 requests/minute
- Burst allowance: 2x base limit for 10 seconds

Rate limit headers:
- `X-RateLimit-Limit`
- `X-RateLimit-Remaining`
- `X-RateLimit-Reset`

## Error Handling
All errors follow a consistent format:

```json
{
  "success": false,
  "error": {
    "code": "ERROR_CODE",
    "message": "Human readable message",
    "details": {}
  }
}
```

Common error codes:
- `VALIDATION_ERROR`: Request validation failed
- `UNAUTHORIZED`: Invalid or missing authentication
- `FORBIDDEN`: Insufficient permissions
- `NOT_FOUND`: Resource not found
- `CONFLICT`: Resource conflict
- `RATE_LIMITED`: Rate limit exceeded
- `INTERNAL_ERROR`: Server error

## Pagination
All list endpoints support pagination:
```
?page=1&limit=20
```
Response includes:
```json
{
  "data": [...],
  "meta": {
    "page": 1,
    "limit": 20,
    "total": 150,
    "totalPages": 8
  }
}
```

## Endpoints

### Authentication
#### POST /auth/login
Login with email and password.

**Request:**
```json
{
  "email": "user@example.com",
  "password": "password123",
  "rememberMe": true
}
```

**Response (200):**
```json
{
  "success": true,
  "data": {
    "user": { "id": "1", "email": "user@example.com", "name": "John", "role": "customer" },
    "token": "eyJhbGciOiJIUzI1NiIs...",
    "refreshToken": "eyJhbGciOiJIUzI1NiIs...",
    "expiresIn": 3600
  }
}
```

#### POST /auth/register
Register new user.

#### POST /auth/refresh
Refresh access token using refresh token.

#### POST /auth/logout
Logout and invalidate tokens.

#### POST /auth/forgot-password
Request password reset.

#### POST /auth/reset-password
Reset password with token.

### Products

#### GET /products
List products with filtering and pagination.

**Query Parameters:**
- `page` (integer, default: 1)
- `limit` (integer, default: 20, max: 100)
- `category` (string): Filter by category slug
- `gender` (string): `muski`, `zenski`, `unisex`
- `minPrice` (number): Minimum price
- `maxPrice` (number): Maximum price
- `sort` (enum): `price_asc`, `price_desc`, `newest`, `bestselling`, `rating`
- `search` (string): Search query
- `inStock` (boolean): Filter in-stock only

**Response:**
```json
{
  "success": true,
  "data": [
    {
      "id": 1,
      "slug": "osnovna-majica",
      "name": "Osnovna Majica",
      "price": 1290,
      "salePrice": 1090,
      "currency": "RSD",
      "category": "majice",
      "images": { "main": "/images/majica.svg" }
    }
  ],
  "meta": {
    "page": 1,
    "limit": 20,
    "total": 150,
    "totalPages": 8
  }
}
```

#### GET /products/{slug}
Get product by slug.

#### GET /products/{id}/reviews
Get product reviews.

#### POST /products/{id}/reviews
Create review (authenticated).

### Categories

#### GET /categories
List categories.

#### GET /categories/{slug}
