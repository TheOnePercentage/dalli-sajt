### Cart

#### GET /cart
Get current user's cart.

#### POST /cart
Add item to cart.
```json
{
  "productId": 1,
  "quantity": 1,
  "variantId": "variant-id"
}
```

#### PATCH /cart/{itemId}
Update quantity.
```json
{ "quantity": 2 }
```

#### DELETE /cart/{itemId}
Remove item.

#### DELETE /cart
Clear cart.

#### POST /cart/promo
Apply promo code.
```json
{ "code": "WELCOME10" }
```

### Orders

#### GET /orders
List orders with pagination and filters.

#### GET /orders/{id}
Get order details.

#### POST /orders
Create order from cart.
```json
{
  "shippingAddress": { ... },
  "billingAddress": { ... },
  "paymentMethod": "card",
  "paymentDetails": { ... },
  "promoCode": "WELCOME10"
}
```

#### GET /orders/{id}/track
Get tracking information.

### Payments

#### POST /payments/intent
Create payment intent.

#### POST /payments/confirm
