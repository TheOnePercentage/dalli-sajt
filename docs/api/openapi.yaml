### Webhooks
Configure webhook endpoints in dashboard.
Events:
- `order.created`
- `order.confirmed`
- `order.shipped`
- `order.delivered`
- `order.cancelled`
- `payment.completed`
- `payment.failed`
- `customer.created`
- `review.created`

Signature verification:
```
X-Webhook-Signature: sha256=...
```
Verify with HMAC-SHA256 using webhook secret.