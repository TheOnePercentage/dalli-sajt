### Promotions

#### GET /promotions
List active promotions.

#### POST /promotions/validate
Validate promo code.
```json
{
  "code": "WELCOME15",
  "cartTotal": 10000
}
```

Response:
```json
{
  "success": true,
  "data": {
    "valid": true,
    "discount": 15,
    "message": "15% discount applied"
  }
}
```

