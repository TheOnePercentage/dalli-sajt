[build]
  command = "npm run build:prod"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/admin/*"
  to = "/admin-login.html"
  status = 302

# --- API: security (CSP reports, CSRF, rate limiting) ---
[[redirects]]
  from = "/api/security/*"
  to = "/.netlify/functions/security"
  status = 200

[[redirects]]
  from = "/api/security"
  to = "/.netlify/functions/security"
  status = 200
