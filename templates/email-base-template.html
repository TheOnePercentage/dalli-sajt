<!DOCTYPE html>
<html lang="sr" class="email-template" style="font-size: 16px; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>DALLI - Porudžbina</title>
    
    <!--[if !mso]><!-- -->
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    <!--<![endif]-->

    <!--[if mso]>
    <style type="text/css">
        * { font-family: Arial, Helvetica, sans-serif !important; }
    </style>
    <![endif]-->

    <style type="text/css">
        /* -- CLIENT-SPECIFIC CSS RESETS -- */
        @ohms-reset .ReadMsgBody { width: 100%; background-color: #f1f1f1; }
        @ohms-reset body { margin: 0 !important; padding: 0 !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; background-color: #f1f1f1; }
        @ohms-reset .ExternalClass { width: 100%; }
        @ohms-reset .ExternalClass * { line-height: 100%; }
        @ohms-reset img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
        @ohms-reset table { border-collapse: collapse !important; }
        @ohms-reset tbody tr { display: block; }
        @ohms-reset * { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        @ohms-reset a { color: #333; text-decoration: none; }
        @ohms-reset a:hover { text-decoration: underline; }

        /* -- RESPONSIVE METRICS -- */
        . img { max-width: 100%; height: auto; }

        /* -- DARK MODE SUPPORT -- */
        @media (prefers-color-scheme: dark) {
            .body { background-color: #1a1a1a !important; color-scheme: dark !important; }
            .bg-light { background-color: #ffffff !important; }
            .bg-dark { background-color: #1a1a1a !important; }
            .text-light { color: #ffffff !important; }
            .text-dark { color: #1a1a1a !important; }
            .text-muted-light { color: #333333 !important; }
            .text-muted-dark { color: #b0b0b0 !important; }
            .border-light { border-color: #e0e0e0 !important; }
            .border-dark { border-color: #4a4a4a !important; }
            .bg-header-light { background-color: #f8f9fa !important; }
            .bg-header-dark { background-color: #2c3e50 !important; }
            .btn-primary-light { background-color: #2c3e50 !important; color: #ffffff !important; }
            .btn-primary-dark { background-color: #1a1a1a !important; color: #ffffff !important; }
        }

        /* -- FALLBACKS FOR CLIENTS WITHOUT MEDIA QUERY SUPPORT -- */
        .bg-light-fallback { background-color: #ffffff; }
        .bg-dark-fallback { background-color: #1a1a1a; }
        .text-light-fallback { color: #333333; }
        .text-dark-fallback { color: #ffffff; }
        .border-light-fallback { border-color: #e0e0e0; }
        .border-dark-fallback { border-color: #4a4a4a; }

        /* -- INLINE STYLES OVERRIDE -- */
        .w32 { width: 32px !important; }
        .h40 { height: 40px !important; }
    </style>
</head>

<body style="margin: 0 !important; padding: 0 !important; background-color: #f1f1f1; font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; color-scheme: light dark; display: block;">
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
                <o:AllowPNG/>
                <o:ContentType="text/html"
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->

    <!-- HEADER SECTION -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f8f9fa; margin: 0;">
        <tr>
            <td align="center" style="padding: 40px 20px 20px;">
                <a href="https://dalli.rs" style="display: inline-block;">
                    <img src="https://dalli.rs/images/logo-dark.svg" 
                         alt="DALLI" 
                         style="height: 40px; max-width: 180px; width: 100%; display: block; object-fit: contain;"
                         id="dalliLogoDark"
                         onmouseout="this.src='https://dalli.rs/images/logo-dark.svg'"
                         onmouseover="this.src='https://dalli.rs/images/logo-light.svg'">
                </a>
            </td>
        </tr>
    </table>

    <!-- MAIN CONTENT CONTAINER -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 600px; margin: 0 auto; background-color: #ffffff; display: block;">
        <tr>
            <td style="padding: 20px; display: block;">
                <!-- Content injected by individual templates via {{{body_content}}} -->
            </td>
        </tr>
    </table>

    <!-- FOOTER SECTION -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f8f9fa; margin: 0;">
        <tr>
            <td align="center" style="padding: 30px 20px;">
                <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px;">
                    <tr>
                        <td style="font-size: 12px; color: #666666; line-height: 1.6; color-scheme: light dark;">
                            <p style="margin: 0 0 8px 0;">DALLI d.o.o. | Beograd, Srbija</p>
                            <p style="margin: 0 0 8px 0;">Ul. Zikice Stankovića 14</p>
                            <p style="margin: 0 0 4px 0;">📞 +381 11 123 456</p>
                            <p style="margin: 0 0 4px 0;">📧 info@dalli.rs</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding-top: 20px; border-top: 1px solid #e0e0e0; font-size: 12px; color: #666666; line-height: 1.6; color-scheme: light dark;">
                            <p style="margin: 0;">Ovo je automatski email sa DALLI sistema. Molimo, ne odgovarajte na ovaj email.</p>
                            <p style="margin: 4px 0 0 0;">&copy; 2026 DALLI. Sva prava zadržana.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <!-- DARK MODE DETECTION & LOGO SWITCH -->
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
            const logoDark = document.getElementById('dalliLogoDark');
            
            if (logoDark) {
                if (prefersDark && prefersDark.matches) {
                    logoDark.src = 'https://dalli.rs/images/logo-light.svg';
                    logoDark.style.filter = 'invert(1)';
                } else {
                    logoDark.src = 'https://dalli.rs/images/logo-dark.svg';
                    logoDark.style.filter = 'none';
                }
                
                // Update on scheme change
                prefersDark.addListener(function(e) {
                    if (e.matches && logoDark) {
                        logoDark.style.filter = 'invert(1)';
                        logoDark.src = 'https://dalli.rs/images/logo-light.svg';
                    } else if (logoDark) {
                        logoDark.style.filter = 'none';
                        logoDark.src = 'https://dalli.rs/images/logo-dark.svg';
                    }
                });
            }
        });
    </script>
</body>
</html>
