<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://dalli.rs/admin-login.html">
    <meta name="theme-color" content="#2c3e50">
    <title>DALLI - Administrator Login</title>
    <link rel="stylesheet" href="css/style.css?v=20241217">
    <link rel="stylesheet" href="css/admin.css?v=20241217">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg?v=20241215">
</head>
<body>
    <main class="admin-login-page" role="main">
        <div class="admin-login-card">
            <div class="admin-login-header">
                <button class="theme-toggle" id="themeToggle" aria-label="Preklopi tamnu/svetlu temu" title="Tamna/Svetla tema">
                    <span class="theme-icon" aria-hidden="true">🌙</span>
                </button>
                <div class="admin-logo">
                    <img class="logo-icon" src="images/logo1.jpg" alt="DALLI Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" loading="lazy">
                    <span class="logo-fallback" aria-hidden="true" style="display:none; width:64px; height:64px; border-radius:12px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); align-items:center; justify-content:center; font-size:2rem;">📦</span>
                </div>
                <h1>DALLI</h1>
                <p class="login-subtitle">Ulogujte se za pristup administrator panelu</p>
            </div>

            <form id="adminLoginForm" class="admin-login-form" novalidate>
                <div class="form-group">
                    <label for="username">Korisničko ime</label>
                    <input type="text" id="username" name="username" autocomplete="username" required placeholder="Unesite korisničko ime" aria-describedby="username-hint">
                    <span id="username-hint" class="form-hint" style="display:none;">Podrazumevano: harissacirovic</span>
                </div>

                <div class="form-group">
                    <label for="password">Lozinka</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="Unesite lozinku">
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Prikaži/Sakrij lozinku">
                            <span class="eye-icon" aria-hidden="true">👁</span>
                        </button>
                    </div>
                </div>

                <div id="loginError" class="login-error hidden" role="alert" aria-live="polite"></div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">Uloguj se</button>
            </form>


                <div class="biometric-section" style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border-color);">
                    <button type="button" id="biometricBtn" class="btn btn-secondary btn-block" style="display:flex;align-items:center;justify-content:center;gap:8px;" aria-label="Prijava biometrijom">
                        <span aria-hidden="true">🫀</span> <span>Prijava otiskom prsta / Face ID</span>
                    </button>
                    <p class="form-hint" style="text-align:center;margin-top:8px;">Dostupno samo na podržanim uređajima</p>
                </div>

            <p class="login-footer">
                <a href="../index.html" class="link">← Vrati se na sajt</a>
            </p>
        </div>
    </main>

    <!-- Toast container for error messages -->
    <div id="toastContainer" style="position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 12px; pointer-events: none;"></div>

    <script src="./js/admin/login.js"></script>
</body>
</html>
