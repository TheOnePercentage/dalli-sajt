<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Duksevi - Muški i Ženski Hoodie">
  <defs>
    <linearGradient id="catDukseri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#166534"/>
    </linearGradient>
    <linearGradient id="catDukseriAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#catDukseri)"/>
  <g opacity="0.05">
    <pattern id="patternDukseri" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 0 L 40 20 L 20 40 Z" fill="none" stroke="white" stroke-width="1"/>
    </pattern>
    <rect width="600" height="600" fill="url(#patternDukseri)"/>
  </g>
  <g transform="translate(300, 300)" text-anchor="middle">
    <text font-family="system-ui, sans-serif" font-size="48" fill="white" font-weight="700">Duksevi (Hoodie)</text>
    <text x="0" y="60" font-family="system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)">Muški 320g/m² • Ženski 260g/m²</text>
    <text x="0" y="100" font-family="system-ui, sans-serif" font-size="16" fill="url(#catDukseriAccent)" font-weight="600">Kenguru džep • Kapuljača • Dvostruki ševovi</text>
  </g>
  <circle cx="300" cy="500" r="80" fill="none" stroke="url(#catDukseriAccent)" stroke-width="2" opacity="0.3"/>
  <text x="300" y="506" font-family="system-ui, sans-serif" font-size="32" fill="url(#catDukseriAccent)" text-anchor="middle" opacity="0.5">🧥</text>
</svg>