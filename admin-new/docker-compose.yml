version: '3.8'

# Imperium Admin - Docker Compose
# Local development and production deployment

services:
  # ------------------------------------------------------------
  # Admin Application
  # ------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL:-http://api:8000/api}
        VITE_WS_URL: ${VITE_WS_URL:-ws://ws:8001}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID}
    image: imperium-admin:${TAG:-latest}
    container_name: imperium-admin
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://api:8000/api}
      - VITE_WS_URL=${VITE_WS_URL:-ws://ws:8001}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN}
      - VITE_GA_MEASUREMENT_ID=${VITE_GA_MEASUREMENT_ID}
      - TZ=Europe/Belgrade
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./docker/nginx.default.conf.template:/etc/nginx/conf.d/default.conf.template:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - imperium-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # ------------------------------------------------------------
  # API Backend (placeholder - replace with actual API)
  # ------------------------------------------------------------
  api:
    image: node:20-alpine
    container_name: imperium-api
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install -g serve && serve -s /app/public -l 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app:ro
    networks:
      - imperium-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------
  # WebSocket Server (placeholder)
  # ------------------------------------------------------------
  ws:
    image: node:20-alpine
    container_name: imperium-ws
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npx ws --port 8001"
    ports:
      - "8001:8001"
    networks:
      - imperium-network

  # ------------------------------------------------------------
  # Redis (for caching, sessions, queues)
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: imperium-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - imperium-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # PostgreSQL (for persistent data)
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: imperium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: imperium_admin
      POSTGRES_USER: ${DB_USER:-imperium}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - imperium-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-imperium} -d imperium_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------
  # Prometheus (metrics collection)
  # ------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: imperium-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - imperium-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------
  # Grafana (visualization)
  # ------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.0
    container_name: imperium-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - imperium-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------
  # Loki (log aggregation)
  # ------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.0
    container_name: imperium-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    networks:
      - imperium-network

  # ------------------------------------------------------------
  # Promtail (log shipping)
  # ------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.0
    container_name: imperium-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./docker/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/log/nginx:/var/log/nginx:ro
    networks:
      - imperium-network
    depends_on:
      - loki

  # ------------------------------------------------------------
  # Alertmanager (alerting)
  # ------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: imperium-alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    volumes:
      - ./docker/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - imperium-network

# ------------------------------------------------------------
# Networks
# ------------------------------------------------------------
networks:
  imperium-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ------------------------------------------------------------
# Volumes
# ------------------------------------------------------------
volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  alertmanager-data:
    driver: local