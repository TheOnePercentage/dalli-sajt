server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: imperium-admin
    static_configs:
      - targets:
          - localhost
        labels:
          job: imperium-admin
          environment: production
          __path__: /var/log/nginx/*.log

  - job_name: imperium-application
    static_configs:
      - targets:
          - localhost
        labels:
          job: imperium-application
          environment: production
          __path__: /var/log/imperium/*.log

  - job_name: systemd-journal
    journal:
      json: false
      max_age: 12h
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: "unit"
      - source_labels: ["__journal__priority"]
        target_label: "priority"