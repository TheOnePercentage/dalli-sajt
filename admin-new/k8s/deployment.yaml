# Imperium Admin - Kubernetes Deployment
# Production-ready K8s manifests

---
apiVersion: v1
kind: Namespace
metadata:
  name: imperium-admin
  labels:
    name: imperium-admin
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: imperium-admin-config
  namespace: imperium-admin
data:
  VITE_API_URL: "https://api.dalli.rs/api"
  VITE_WS_URL: "wss://ws.dalli.rs"
  VITE_SENTRY_DSN: ""
  VITE_GA_MEASUREMENT_ID: ""
  TZ: "Europe/Belgrade"

---
apiVersion: v1
kind: Secret
metadata:
  name: imperium-admin-secrets
  namespace: imperium-admin
type: Opaque
stringData:
  VITE_SENTRY_DSN: ""
  DB_PASSWORD: ""
  REDIS_PASSWORD: ""
  GRAFANA_PASSWORD: ""

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imperium-admin
  namespace: imperium-admin
  labels:
    app: imperium-admin
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: imperium-admin
  template:
    metadata:
      labels:
        app: imperium-admin
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: imperium-admin
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: imperium-admin
          image: ghcr.io/dalli/imperium-admin:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP
          envFrom:
            - configMapRef:
                name: imperium-admin-config
            - secretRef:
                name: imperium-admin-secrets
          env:
            - name: TZ
              value: "Europe/Belgrade"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - imperium-admin
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: imperium-admin

---
apiVersion: v1
kind: Service
metadata:
  name: imperium-admin
  namespace: imperium-admin
  labels:
    app: imperium-admin
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 443
      targetPort: 8443
      protocol: TCP
      name: https
  selector:
    app: imperium-admin

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: imperium-admin
  namespace: imperium-admin
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1s"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - admin.dalli.rs
      secretName: imperium-admin-tls
  rules:
    - host: admin.dalli.rs
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: imperium-admin
                port:
                  number: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: imperium-admin
  namespace: imperium-admin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: imperium-admin
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: imperium-admin
  namespace: imperium-admin
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: imperium-admin

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: imperium-admin
  namespace: imperium-admin

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: imperium-admin
  namespace: imperium-admin
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: imperium-admin
  namespace: imperium-admin
subjects:
  - kind: ServiceAccount
    name: imperium-admin
    namespace: imperium-admin
roleRef:
  kind: Role
  name: imperium-admin
  apiGroup: rbac.authorization.k8s.io