<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Tekstura organskog pamuka — prirodno vlakno, gramaza 180-320 g/m²">
  <defs>
    <linearGradient id="storyCotton" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3f0"/>
      <stop offset="50%" stop-color="#ebe7e2"/>
      <stop offset="100%" stop-color="#dfdad3"/>
    </linearGradient>
    <radialGradient id="cottonFiber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4bfb6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c4bfb6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cottonSpecks" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1" fill="#a8a094" opacity="0.12"/>
      <circle cx="28" cy="22" r="0.8" fill="#a8a094" opacity="0.1"/>
      <circle cx="15" cy="32" r="0.6" fill="#a8a094" opacity="0.08"/>
      <circle cx="32" cy="12" r="0.5" fill="#a8a094" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#storyCotton)"/>
  <rect width="800" height="600" fill="url(#cottonSpecks)"/>
  <ellipse cx="400" cy="300" rx="300" ry="200" fill="url(#cottonFiber)"/>
  <g opacity="0.06" transform="translate(400, 300)">
    <ellipse cx="-100" cy="-50" rx="3" ry="2" fill="#8b857d" transform="rotate(-15)"/>
    <ellipse cx="80" cy="60" rx="2.5" ry="1.5" fill="#8b857d" transform="rotate(30)"/>
    <ellipse cx="-150" cy="40" rx="2" ry="1" fill="#8b857d" transform="rotate(-45)"/>
    <ellipse cx="120" cy="-30" rx="1.8" ry="0.9" fill="#8b857d" transform="rotate(60)"/>
    <ellipse cx="-50" cy="100" rx="2.2" ry="1.2" fill="#8b857d" transform="rotate(-20)"/>
    <ellipse cx="180" cy="20" rx="1.5" ry="0.8" fill="#8b857d" transform="rotate(10)"/>
  </g>
</svg>