<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ženska Garderoba - Majice, Trenerke, Duksevi">
  <defs>
    <linearGradient id="catZenski" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#701a75"/>
      <stop offset="100%" style="stop-color:#be185d"/>
    </linearGradient>
    <linearGradient id="catZenskiAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f472b6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#catZenski)"/>
  <g opacity="0.05">
    <pattern id="patternZenski" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="12" fill="none" stroke="white" stroke-width="1"/>
    </pattern>
    <rect width="600" height="600" fill="url(#patternZenski)"/>
  </g>
  <g transform="translate(300, 300)" text-anchor="middle">
    <text font-family="system-ui, sans-serif" font-size="48" fill="white" font-weight="700">Ženska Garderoba</text>
    <text x="0" y="60" font-family="system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)">Majice • Trenerke • Duksevi</text>
    <text x="0" y="100" font-family="system-ui, sans-serif" font-size="16" fill="url(#catZenskiAccent)" font-weight="600">Prilagođeno ženskom fitu • Meke tkanine</text>
  </g>
  <circle cx="300" cy="500" r="80" fill="none" stroke="url(#catZenskiAccent)" stroke-width="2" opacity="0.3"/>
  <text x="300" y="506" font-family="system-ui, sans-serif" font-size="32" fill="url(#catZenskiAccent)" text-anchor="middle" opacity="0.5">👩</text>
</svg>